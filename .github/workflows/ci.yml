name: patch-integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test patch engine and manifests
        run: npm test

      - name: Rebuild installers reproducibly
        run: |
          npm run build
          cp dist/pocketrisu-patcher.cjs "$RUNNER_TEMP/pocketrisu-patcher.first.cjs"
          npm run build
          cmp -s "$RUNNER_TEMP/pocketrisu-patcher.first.cjs" dist/pocketrisu-patcher.cjs
          test "$(stat -c '%a' dist/pocketrisu-patcher.cjs)" = 755
          test -z "$(git status --porcelain -- dist)"
          node --check dist/pocketrisu-patcher.cjs

      - name: Check out PocketRisu v1.10.0
        uses: actions/checkout@v6
        with:
          repository: PocketRisu/PocketRisu
          ref: v1.10.0
          path: .ci/pocketrisu

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.1

      - name: Apply complete patch set
        run: |
          node dist/pocketrisu-patcher.cjs plan --root .ci/pocketrisu --json
          node dist/pocketrisu-patcher.cjs apply --root .ci/pocketrisu --json
          node dist/pocketrisu-patcher.cjs status --root .ci/pocketrisu --json
          node -e "const {execFileSync}=require('node:child_process'); const plan=JSON.parse(execFileSync(process.execPath,['dist/pocketrisu-patcher.cjs','plan','--root','.ci/pocketrisu','--json'],{encoding:'utf8'})); if(plan.compatibility.status!=='verified'||plan.changedFiles.length!==0) process.exit(1)"

      - name: Install patched PocketRisu dependencies
        working-directory: .ci/pocketrisu
        run: |
          pnpm install --frozen-lockfile
          pnpm why lightningcss

      - name: Run embedded PocketRisu checks
        working-directory: .ci/pocketrisu
        env:
          NODE_OPTIONS: --no-experimental-webstorage
        run: |
          pnpm test
          pnpm test:compat
          pnpm check
          pnpm check:help
          pnpm build
          node server/node/bgOrchBundle.build.cjs

      - name: Verify byte and mode round trip
        run: |
          node dist/pocketrisu-patcher.cjs revert --root .ci/pocketrisu --json
          rm -f .ci/pocketrisu/server/node/bgOrchBundle.css
          rm -f .ci/pocketrisu/server/node/bgOrchBundle.mjs
          git -C .ci/pocketrisu diff --exit-code
          test -z "$(git -C .ci/pocketrisu status --porcelain)"
